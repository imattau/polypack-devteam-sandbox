name: Auto-merge on green CI

# Merges a pull request automatically once its CI run succeeds -- branch protection on main no
# longer requires a human/bot review (see agent-review.yml's history: every approval had to be
# relayed through github-actions[bot] because GitHub blocks self-approval, which the shared
# devteam PAT identity made unavoidable; that relay added a whole async round-trip just to prove
# what a green CI run already proves). CI passing plus "must go through a PR" (still enforced by
# branch protection) is now the actual merge gate; review feedback still flows through
# agent-review.yml's request_changes path and the PR_FEEDBACK loop, it just no longer blocks
# merge on its own.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Merge any open PRs whose head just passed CI
        run: |
          set -e
          PRS=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[].number')
          if [ -z "$PRS" ]; then
            echo "No pull requests associated with this run."
            exit 0
          fi
          for PR in $PRS; do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json state -q .state)
            if [ "$STATE" != "OPEN" ]; then
              echo "PR #$PR is not open ($STATE) -- skipping."
              continue
            fi
            echo "Merging PR #$PR (CI passed)."
            gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
              || echo "Merge failed for #$PR (e.g. not up to date with main) -- will retry on the next green run."
          done
